server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/orders/**
    eureka:
      client:
        serviceUrl:
          defaultZone: http://localhost:8761/eureka/

